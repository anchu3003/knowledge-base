name: tests

# Chạy cho cả 3 thư mục của monorepo. Test BE dùng fake provider
# (xem Knowledge-base/tests/conftest.py) nên KHÔNG cần API key và không gọi mạng.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Knowledge-base
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Knowledge-base/requirements.txt
            Knowledge-base/requirements-dev.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # Bản torch mặc định của PyPI kéo theo ~3 GB nvidia-* (không dùng vì chạy CPU).
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: pytest
        # `python -m pytest` (không phải `pytest`) để CWD nằm trên sys.path,
        # nếu không `from app.main import ...` trong conftest sẽ lỗi ModuleNotFoundError.
        run: python -m pytest -q

  frontend:
    name: frontend (vitest + typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Knowledge-base-fe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Knowledge-base-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
