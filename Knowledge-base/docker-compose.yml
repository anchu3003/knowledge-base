version: "3.9"

services:
  chatbot-api:
    build: .
    container_name: chatbot-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      #mount source code to docker auto refresh
#      - .:/app
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped

  chatbot-ui:
    build: ../knowledge-base-fe/
    container_name: chatbot-ui
    ports:
      - "3000:3000"
    volumes:
      - ../knowledge-base-fe/:/app
    restart: unless-stopped
